<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SZKローテ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:#f0f2f5;color:#111}
@media(prefers-color-scheme:dark){body{background:#0f1117;color:#e2e8f0}}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#fff}
@media(prefers-color-scheme:dark){#app{background:#1a1f2e}}
.hdr{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:0.5px solid rgba(0,0,0,0.12);background:#f8f9fb;flex-shrink:0;z-index:30;flex-wrap:wrap}
@media(prefers-color-scheme:dark){.hdr{background:#1e2535;border-color:rgba(255,255,255,0.12)}}
.hdr-title{font-size:15px;font-weight:500;letter-spacing:.04em}
.body{display:flex;flex:1;overflow:hidden}
.side{width:230px;flex-shrink:0;border-right:0.5px solid rgba(0,0,0,0.10);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:#f8f9fb;transition:width .2s,padding .2s,border .2s}
@media(prefers-color-scheme:dark){.side{background:#1e2535;border-color:rgba(255,255,255,0.10)}}
.side.hidden{width:0;padding:0;overflow:hidden;border-right:none}
.collapsible-hdr{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:4px 0;user-select:none}
.collapsible-arrow{font-size:10px;color:#6b7280;transition:transform .18s}
.collapsible-arrow.open{transform:rotate(90deg)}
.collapsible-body{overflow:hidden;transition:max-height .2s ease}
.collapsible-body.closed{max-height:0!important}
.sec-lbl{font-size:11px;font-weight:500;color:#6b7280;letter-spacing:.06em}
.form-row{display:flex;flex-direction:column;gap:3px;margin-bottom:7px}
.form-row label{font-size:11px;color:#6b7280}
.form-row input{font-size:12px;padding:5px 8px;border:0.5px solid rgba(0,0,0,0.2);border-radius:6px;background:#fff;color:#111;outline:none;width:100%;font-family:inherit}
@media(prefers-color-scheme:dark){.form-row input{background:#161b27;color:#e2e8f0;border-color:rgba(255,255,255,0.2)}}
.form-row input:focus{border-color:#1D9E75}
.radio-row{display:flex;gap:8px;margin-top:2px;flex-wrap:wrap}
.radio-row label{display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer}
.radio-row input[type=radio]{width:auto;accent-color:#1D9E75}
.molt-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.molt-row input[type=checkbox]{accent-color:#7F77DD;width:auto}
.molt-age-wrap{display:flex;align-items:center;gap:4px;flex:1}
.molt-age-wrap input{font-size:12px;padding:5px 8px;border:0.5px solid rgba(0,0,0,0.2);border-radius:6px;background:#fff;color:#111;outline:none;width:100%;font-family:inherit}
@media(prefers-color-scheme:dark){.molt-age-wrap input{background:#161b27;color:#e2e8f0;border-color:rgba(255,255,255,0.2)}}
.molt-age-wrap span{font-size:11px;color:#6b7280;white-space:nowrap}
.btn-add{width:100%;padding:7px;background:#1D9E75;color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:2px}
.btn-add:hover{background:#0F6E56}
.btn-toriaezu{flex:0 0 auto;padding:7px 10px;background:#7e3af2;color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-toriaezu:hover{background:#6d28d9}
.btn-toriaezu.on{background:#6d28d9;box-shadow:inset 0 1px 3px rgba(0,0,0,0.3)}
.btn-form-save{width:100%;padding:7px;background:#185FA5;color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:2px}
.btn-form-save:hover{background:#0C447C}
.btn-cancel{width:100%;padding:6px;background:none;border:0.5px solid rgba(0,0,0,0.15);color:#6b7280;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;margin-top:4px}
.btn-del-lot{width:100%;padding:6px;background:none;border:0.5px solid rgba(224,92,92,0.5);color:#E24B4A;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;margin-top:6px}
.btn-del-lot:hover{background:rgba(224,92,92,0.08)}
.drop-zone{border:1.5px dashed rgba(0,0,0,0.2);border-radius:6px;padding:10px 8px;text-align:center;font-size:11px;color:#6b7280;cursor:pointer;transition:border-color .15s,background .15s}
@media(prefers-color-scheme:dark){.drop-zone{border-color:rgba(255,255,255,0.2)}}
.drop-zone.drag-over{border-color:#1D9E75;background:rgba(29,158,117,0.06);color:#1D9E75}
.csv-hint{font-size:10px;color:#6b7280;line-height:1.6;padding:7px;background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:6px}
@media(prefers-color-scheme:dark){.csv-hint{background:#161b27;border-color:rgba(255,255,255,0.1)}}
.csv-hint code{font-family:monospace;font-size:10px;color:#1D9E75}
.lot-item{padding:5px 7px;background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:6px;margin-bottom:4px;cursor:pointer;transition:border-color .15s}
@media(prefers-color-scheme:dark){.lot-item{background:#161b27;border-color:rgba(255,255,255,0.1)}}
.lot-item:hover{border-color:rgba(0,0,0,0.3)}
@media(prefers-color-scheme:dark){.lot-item:hover{border-color:rgba(255,255,255,0.3)}}
.lot-item.editing{border-color:#185FA5;background:#f0f5ff}
@media(prefers-color-scheme:dark){.lot-item.editing{background:#1a2035}}
.lot-item-top{display:flex;align-items:center;gap:5px;width:100%}
.lot-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.lot-name{font-size:11px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lot-meta{font-size:10px;font-family:monospace;flex-shrink:0;color:#6b7280}
.lot-sub{font-size:10px;color:#6b7280;padding-left:13px;margin-top:2px}
.btn-hide{background:none;border:0.5px solid rgba(0,0,0,0.15);cursor:pointer;font-size:10px;padding:2px 6px;border-radius:4px;color:#6b7280;white-space:nowrap;font-family:inherit}
.btn-hide:hover{background:rgba(0,0,0,0.05)}
.btn-hide.is-hidden{color:#7e3af2;border-color:#7e3af2;background:rgba(126,58,242,0.08)}
.edit-form{margin-top:8px;display:flex;flex-direction:column;gap:0}
.edit-form .form-row{margin-bottom:5px}
.edit-form .form-row label{font-size:10px}
.edit-form .form-row input{font-size:11px;padding:4px 7px}
.edit-form .radio-row label{font-size:11px}
.edit-form .molt-row{margin-bottom:5px}
.edit-form .molt-age-wrap input{font-size:11px;padding:4px 7px}
.edit-form .molt-age-wrap span{font-size:10px}
.warn-banner{background:rgba(224,92,92,0.12);border:0.5px solid rgba(224,92,92,0.4);border-radius:6px;padding:6px 10px;font-size:11px;color:#E24B4A;display:none;margin-top:4px}
.toggle-btn{background:#f8f9fb;border:0.5px solid rgba(0,0,0,0.15);color:#6b7280;font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;font-family:inherit}
@media(prefers-color-scheme:dark){.toggle-btn{background:#1e2535;border-color:rgba(255,255,255,0.15)}}
.btn-editmode{font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;font-family:inherit;font-weight:500;transition:all .15s}
.btn-editmode.off{background:#f8f9fb;border:0.5px solid rgba(0,0,0,0.15);color:#6b7280}
@media(prefers-color-scheme:dark){.btn-editmode.off{background:#1e2535;border-color:rgba(255,255,255,0.15)}}
.btn-editmode.on{background:#1D9E75;border:0.5px solid #1D9E75;color:#fff}
.btn-rotation{font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;font-family:inherit;font-weight:500;transition:all .15s}
.btn-rotation.off{background:#f8f9fb;border:0.5px solid rgba(0,0,0,0.15);color:#6b7280}
@media(prefers-color-scheme:dark){.btn-rotation.off{background:#1e2535;border-color:rgba(255,255,255,0.15)}}
.btn-rotation.on{background:#7e3af2;border:0.5px solid #7e3af2;color:#fff}
.btn-log{background:#f8f9fb;border:0.5px solid rgba(0,0,0,0.15);color:#6b7280;font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;font-family:inherit}
@media(prefers-color-scheme:dark){.btn-log{background:#1e2535;border-color:rgba(255,255,255,0.15)}}
.btn-csv-hdr{background:#c0392b;border:none;color:#fff;font-size:11px;padding:5px 12px;border-radius:6px;cursor:pointer;font-family:inherit;white-space:nowrap;font-weight:500}
.btn-csv-hdr:hover{background:#922b21}
.btn-pdf{background:#185FA5;border:none;color:#fff;font-size:11px;padding:5px 12px;border-radius:6px;cursor:pointer;font-family:inherit;white-space:nowrap;font-weight:500}
.btn-pdf:hover{background:#0C447C}
.btn-zoom{background:#f8f9fb;border:0.5px solid rgba(0,0,0,0.15);color:#374151;font-size:13px;padding:3px 8px;border-radius:6px;cursor:pointer;font-family:inherit;line-height:1}
@media(prefers-color-scheme:dark){.btn-zoom{background:#1e2535;border-color:rgba(255,255,255,0.15);color:#e2e8f0}}
.btn-zoom:hover{background:#e5e7eb}
.zoom-lbl{font-size:10px;color:#6b7280;min-width:34px;text-align:center}
.divider{border:none;border-top:0.5px solid rgba(0,0,0,0.1);margin:2px 0}
@media(prefers-color-scheme:dark){.divider{border-color:rgba(255,255,255,0.1)}}
.chart-outer{flex:1;overflow:hidden;position:relative}
.xaxis-top,.xaxis-bot{position:absolute;overflow:hidden;z-index:10;pointer-events:none}
.corner-tl,.corner-bl{position:absolute;z-index:20}
.chart-mid{position:absolute;left:0;right:0;display:flex;overflow:hidden}
.yaxis-wrap{overflow:hidden;flex-shrink:0;position:relative;z-index:10}
.chart-scroll{flex:1;overflow:auto;position:relative}
#farm-tip{display:none;position:fixed;background:#fff;border:0.5px solid rgba(0,0,0,0.15);border-radius:10px;padding:10px 14px;font-size:11px;pointer-events:none;z-index:300;box-shadow:0 4px 16px rgba(0,0,0,0.15);min-width:280px;max-width:360px;}.ft-title{font-weight:700;font-size:12px;margin-bottom:5px;color:#003060;border-bottom:1px solid #eee;padding-bottom:3px;}.ft-row{display:flex;justify-content:space-between;gap:8px;padding:1px 0;}.ft-lot{color:#555;}.ft-val{font-family:monospace;font-weight:600;color:#111;}.ft-total{border-top:1px solid #ddd;margin-top:3px;padding-top:3px;font-weight:700;}
#tooltip{display:none;position:absolute;background:#fff;border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;padding:6px 10px;font-size:12px;pointer-events:none;z-index:100;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.1)}
@media(prefers-color-scheme:dark){#tooltip{background:#1e2535;border-color:rgba(255,255,255,0.2)}}
.tt-name{font-weight:500;margin-bottom:3px;padding-bottom:3px;border-bottom:0.5px solid rgba(0,0,0,0.1)}
@media(prefers-color-scheme:dark){.tt-name{border-color:rgba(255,255,255,0.1)}}
.tt-r{display:flex;justify-content:space-between;gap:14px;margin-top:2px;font-size:11px}
.tt-r b{color:inherit;font-family:monospace}
.log-clear{font-size:10px;color:#9ca3af;background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:4px}
.log-clear:hover{color:#E24B4A;background:rgba(224,92,92,0.08)}
#log-body{overflow-y:auto;max-height:200px}
.log-entry{font-size:10px;color:#6b7280;padding:3px 0;border-bottom:0.5px solid rgba(0,0,0,0.05);line-height:1.5}
@media(prefers-color-scheme:dark){.log-entry{border-color:rgba(255,255,255,0.06)}}
.log-time{color:#9ca3af;margin-right:6px;font-family:monospace;font-size:10px}
.log-lot{color:#1D9E75;font-weight:500}
.log-key{color:#185FA5}
.log-val{color:#111;font-family:monospace}
@media(prefers-color-scheme:dark){.log-val{color:#e2e8f0}}
.annot-input{position:absolute;background:transparent;border:none;outline:none;color:#E24B4A;font-size:13px;font-weight:bold;font-family:monospace;min-width:80px;z-index:150;}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.2);border-radius:3px}
@media(prefers-color-scheme:dark){::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2)}}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="hdr-title">SZKローテ</div>
    <button class="toggle-btn" id="toggle-btn" onclick="toggleSide()">▶ ロット管理</button>
    <button class="btn-editmode off" id="btn-editmode" onclick="toggleEditMode()">✏️ 編集</button>
    <button class="btn-rotation off" id="btn-annot" onclick="toggleAnnotMode()" style="display:none">📝 注釈</button>
    <button class="btn-rotation off" id="btn-rotation" onclick="toggleRotation()">🔄 舎繰り線</button>
    <button class="toggle-btn" id="btn-undo" onclick="undo()" title="元に戻す (Ctrl+Z)" disabled>↩ 元に戻す</button>
    <button class="toggle-btn" id="btn-redo" onclick="redo()" title="やり直す (Ctrl+Y)" disabled>↪ やり直す</button>
    <button class="btn-csv-hdr" onclick="exportCSV()">💾 保存</button>
    <button class="btn-pdf" onclick="exportPDF()">PDF出力</button>
    <div style="display:flex;align-items:center;gap:3px;margin-left:4px">
      <button class="btn-zoom" onclick="changeZoom(1)" title="拡大">＋</button>
      <span class="zoom-lbl" id="zoom-lbl">100%</span>
      <button class="btn-zoom" onclick="changeZoom(-1)" title="縮小">－</button>
    </div>

    <div id="hdr-legend" style="margin-left:auto;display:flex;align-items:center;gap:8px;font-size:10px;color:#6b7280">
      <span style="display:inline-block;width:16px;height:3px;background:#f59e0b;border-radius:2px;vertical-align:middle"></span>育雛1号
      <span style="display:inline-block;width:16px;height:3px;background:#60b3f0;border-radius:2px;vertical-align:middle"></span>育雛2号
      <span style="display:inline-block;width:16px;height:3px;background:#7F77DD;border-radius:2px;vertical-align:middle"></span>強換期
      <span style="display:inline-block;width:9px;height:9px;border:2px solid #888;vertical-align:middle"></span>移動日
      <span style="display:inline-block;width:14px;height:2px;background:#E24B4A;border-radius:1px;vertical-align:middle"></span>今日
    </div>
  </div>
  <div class="body">
    <div class="side hidden" id="side">
      <div>
        <div class="collapsible-hdr" onclick="toggleSection('csv')"><span class="sec-lbl">CSV読み込み</span><span class="collapsible-arrow" id="arrow-csv">▶</span></div>
        <div class="collapsible-body closed" id="body-csv" style="max-height:0">
          <div style="height:6px"></div>
          <div class="drop-zone" id="drop-zone" onclick="document.getElementById('csv-input').click()" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="handleDrop(event)">クリックまたは<br>ドラッグ＆ドロップ</div>
          <input type="file" id="csv-input" accept=".csv" style="display:none" onchange="handleFileInput(this)">
          <div class="csv-hint" style="margin-top:6px">列順：<code>ロット名,餌付け日,アウト日齢</code><br>任意：<code>成鶏舎,育雛舎,羽数,孵化場,強換開始日齢</code></div>
        </div>
      </div>
      <hr class="divider">
      <div>
        <div class="collapsible-hdr" onclick="toggleSection('manual')"><span class="sec-lbl">手動登録</span><span class="collapsible-arrow" id="arrow-manual">▶</span></div>
        <div class="collapsible-body closed" id="body-manual" style="max-height:0">
          <div style="height:6px"></div>
          <div class="form-row"><label>ロット名</label><input id="f-name" maxlength="16"></div>
          <div class="form-row"><label>成鶏舎</label><select id="f-house" style="font-size:12px;padding:5px 8px;border:0.5px solid rgba(0,0,0,0.2);border-radius:6px;background:#fff;color:#111;outline:none;width:100%;font-family:inherit"><option value=""></option><option value="1号舎">1号舎</option><option value="2号舎">2号舎</option><option value="3号舎">3号舎</option><option value="4号舎">4号舎</option><option value="5号舎">5号舎</option><option value="AB舎">AB舎</option><option value="C舎">C舎</option></select></div>
          <div class="form-row"><label>餌付け日 *</label><input id="f-date" type="date"></div>
          <div class="form-row"><label>アウト日齢 *</label><input id="f-age" type="number" min="1" max="999"></div>
          <div class="warn-banner" id="age-warn">⚠ 720日齢を超えています</div>
          <div class="form-row" style="margin-top:4px"><label>育雛舎</label><div class="radio-row"><label><input type="radio" name="brooder" value="1号" checked>1号</label><label><input type="radio" name="brooder" value="2号">2号</label><label><input type="radio" name="brooder" value="">未設定</label></div></div>
          <div class="form-row"><label>羽数</label><input id="f-birds" type="number" min="0"></div>
          <div class="form-row"><label>孵化場</label><input id="f-hatchery" maxlength="30"></div>
          <div class="molt-row">
            <input type="checkbox" id="f-molt-chk" onchange="toggleMoltInput()">
            <label for="f-molt-chk" style="font-size:11px;color:#6b7280;cursor:pointer">強換あり</label>
            <div class="molt-age-wrap" id="molt-age-wrap" style="display:none"><input type="number" id="f-molt-age" min="1" max="999" placeholder="開始日齢"><span>日齢〜</span></div>
          </div>
          <div style="display:flex;gap:6px;margin-top:2px">
            <button class="btn-add" style="flex:1;margin-top:0" onclick="addLot()">＋ ロット追加</button>
            <button class="btn-toriaezu" id="btn-toriaezu" onclick="toggleToriaezu()">（仮）</button>
          </div>
        </div>
      </div>
      <hr class="divider">
      <div>
        <div class="collapsible-hdr" onclick="toggleSection('lots')"><span class="sec-lbl">登録済みロット</span><span class="collapsible-arrow" id="arrow-lots">▶</span></div>
        <div class="collapsible-body closed" id="body-lots" style="max-height:0">
          <div style="height:6px"></div>
          <div id="lot-list"></div>
        </div>
      </div>
      <hr class="divider">
      <div>
        <div class="collapsible-hdr" onclick="toggleSection('log')"><span class="sec-lbl">📋 変更ログ</span><span class="collapsible-arrow" id="arrow-log">▶</span></div>
        <div class="collapsible-body closed" id="body-log" style="max-height:0">
          <div style="height:4px"></div>
          <div style="display:flex;justify-content:flex-end;margin-bottom:4px">
            <button class="log-clear" onclick="clearLog()">クリア</button>
          </div>
          <div id="log-body"><div style="font-size:10px;color:#9ca3af;padding:4px 0">変更履歴はありません</div></div>
        </div>
      </div>
    </div>
    <div class="chart-outer" id="chart-outer">
      <canvas id="cvCornerTL" class="corner-tl"></canvas>
      <canvas id="cvCornerBL" class="corner-bl"></canvas>
      <div class="xaxis-top" id="xaxis-top"><canvas id="cvXTop"></canvas></div>
      <div class="xaxis-bot" id="xaxis-bot"><canvas id="cvXBot"></canvas></div>
      <div class="chart-mid" id="chart-mid">
        <div class="yaxis-wrap" id="yaxis-wrap"><canvas id="cvY"></canvas></div>
        <div class="chart-scroll" id="chart-scroll">
          <canvas id="cvMain"></canvas>
          <div id="farm-tip"></div>
          <div id="tooltip"><div class="tt-name" id="tt-name"></div><div id="tt-body"></div><div id="tt-perf"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>


<script>
// ── 定数 ──────────────────────────────────────────
var COLORS=['#1D9E75','#378ADD','#BA7517','#D4537E','#185FA5','#D85A30','#639922','#993556','#534AB7','#0F6E56'];

// 成鶏舎カラーマップ
var HOUSE_COLORS={
  '1号舎':'#1D9E75',
  '2号舎':'#378ADD',
  '3号舎':'#D85A30',
  '4号舎':'#BA7517',
  '5号舎':'#993556',
  'AB舎':'#639922',
  'C舎': '#534AB7'
};
function houseColor(house){return HOUSE_COLORS[house]||'#888888';}
var IKUSEI_1='#f59e0b',IKUSEI_2='#60b3f0',IKUSEI_NONE='#aaaaaa',MOLT_COLOR='#7F77DD';
var ROT_HOUSE_COLOR='#d43030',ROT_BROOD_COLOR='#3050d0';
var CW=38,CH=38,YW=72,XH=44,MAX_AGE=720,MAX_TRANSFER=150,MOLT_DAYS=30;
var ROWS=Math.ceil(MAX_AGE/30);
var INTERVAL_H=22;

function clearLog(){logEntries=[];renderLog();}
function renderLog(){
  var el=document.getElementById('log-body');
  if(!logEntries.length){el.innerHTML='<div style="font-size:10px;color:#9ca3af;padding:4px 0">変更履歴はありません</div>';return;}
  el.innerHTML=logEntries.slice().reverse().map(function(e){
    return '<div class="log-entry"><span class="log-time">'+e.time+'</span>'+e.msg+'</div>';
  }).join('');
}
function addLog(msg){
  var now=new Date();
  var t=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  logEntries.push({time:t,msg:msg});
  if(logEntries.length>200)logEntries.shift();
  renderLog();
  if(!logPanelOpen){
    var ti=document.getElementById('log-hdr-title');
    if(ti){ti.style.color='#1D9E75';setTimeout(function(){ti.style.color='';},1400);}
  }
}
function logChange(lotName,key,val){
  addLog('<span class="log-lot">'+lotName+'</span>の<span class="log-key">'+key+'</span>を<span class="log-val">'+val+'</span>に変更');
}

function toXY(date,age,by){var col=(date.getFullYear()-by)*12+date.getMonth();var frac=(date.getDate()-1)/dim(date.getFullYear(),date.getMonth());return{x:(col+frac)*CW,y:(ROWS-Math.min(age,MAX_AGE)/30)*CH};}

function setupCv(id,w,h){var el=document.getElementById(id);el.width=Math.round(w*DPR);el.height=Math.round(h*DPR);el.style.width=w+'px';el.style.height=h+'px';var ctx=el.getContext('2d');ctx.scale(DPR,DPR);return ctx;}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}
function diamond(ctx,x,y,s,fc,sc,sw){ctx.fillStyle=fc;ctx.strokeStyle=sc;ctx.lineWidth=sw||1.5;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x+s,y);ctx.lineTo(x,y+s);ctx.lineTo(x-s,y);ctx.closePath();ctx.fill();ctx.stroke();}
function moltLabel(ctx,px,py,l1,l2,color,W,H,dark){

// ── 舎繰り線 ─────────────────────────────────────
function drawDashArrow(ctx,x1,y1,x2,y2,color,_unused,lw,alpha){
  lw=lw||5;alpha=alpha||1;
  var ang=Math.atan2(y2-y1,x2-x1),hs=lw>5?18:14;
  var ex=x2-hs*0.7*Math.cos(ang),ey=y2-hs*0.7*Math.sin(ang);
  ctx.save();
  ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.setLineDash([10,6]);ctx.lineCap='round';ctx.globalAlpha=alpha;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.setLineDash([]);ctx.fillStyle=color;ctx.globalAlpha=alpha;
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-hs*Math.cos(ang-0.45),y2-hs*Math.sin(ang-0.45));
  ctx.lineTo(x2-hs*Math.cos(ang+0.45),y2-hs*Math.sin(ang+0.45));
  ctx.closePath();ctx.fill();
  ctx.restore();
}
function getToriaezuLot(){
  if(!toriaezu)return null;
  var feed=parseDate(toriaezu.feedDate);if(!feed)return null;
  var houseEl=document.getElementById('f-house'),brooderEl=document.querySelector('input[name="brooder"]:checked');
  return{feedDate:toriaezu.feedDate,outAge:toriaezu.outAge,transferAge:toriaezu.transferAge||120,house:houseEl?houseEl.value:'',brooder:brooderEl?brooderEl.value:'',hidden:false,isToriaezu:true};
}
function calcHouseRotations(){
  var result=[],byHouse={};
  var allLots=lots.filter(function(l){return !l.hidden;});
  var tl=getToriaezuLot();if(tl&&tl.house)allLots=allLots.concat([tl]);
  allLots.forEach(function(l){
    var feed=parseDate(l.feedDate);if(!feed||!l.outAge||!l.house)return;
    var age=parseInt(l.outAge),dispAge=Math.min(age,MAX_AGE);
    var tAge=clampT((l.transferAge!==undefined)?l.transferAge:Math.min(120,dispAge),age);
    byHouse[l.house]=byHouse[l.house]||[];
    byHouse[l.house].push({feed:feed,outDate:addDays(feed,dispAge),realOutDate:addDays(feed,age),transferDate:addDays(feed,tAge),dispAge:dispAge,tAge:tAge,isToriaezu:!!l.isToriaezu});
  });
  Object.keys(byHouse).forEach(function(house){
    var arr=byHouse[house];arr.sort(function(a,b){return a.feed-b.feed;});
    for(var i=0;i<arr.length-1;i++){
      var prev=arr[i],next=arr[i+1];
      var days=Math.round((next.transferDate-prev.realOutDate)/86400000);
      var feedInterval=Math.round((next.feed-prev.feed)/86400000);
      var isTmp=prev.isToriaezu||next.isToriaezu;
      result.push({label:house,fromDate:prev.outDate,fromAge:prev.dispAge,toDate:next.transferDate,toAge:next.tAge,
        days:days,color:ROT_HOUSE_COLOR,isTmp:isTmp,
        feedInterval:feedInterval,gapFromDate:prev.feed,gapToDate:next.feed});
    }
  });
  return result;
}
function calcBroodRotations(){
  var result=[],byBrood={};
  var allLots=lots.filter(function(l){return !l.hidden;});
  var tl=getToriaezuLot();if(tl&&tl.brooder)allLots=allLots.concat([tl]);
  allLots.forEach(function(l){
    var feed=parseDate(l.feedDate);if(!feed||!l.outAge||!l.brooder)return;
    var age=parseInt(l.outAge),dispAge=Math.min(age,MAX_AGE);
    var tAge=clampT((l.transferAge!==undefined)?l.transferAge:Math.min(120,dispAge),age);
    byBrood[l.brooder]=byBrood[l.brooder]||[];
    byBrood[l.brooder].push({feed:feed,transferDate:addDays(feed,tAge),tAge:tAge,isToriaezu:!!l.isToriaezu});
  });
  Object.keys(byBrood).forEach(function(brood){
    var arr=byBrood[brood];arr.sort(function(a,b){return a.feed-b.feed;});
    for(var i=0;i<arr.length-1;i++){
      var prev=arr[i],next=arr[i+1];
      var isTmp=prev.isToriaezu||next.isToriaezu;
      var feedInterval=Math.round((next.feed-prev.feed)/86400000);
      result.push({label:brood,fromDate:prev.transferDate,fromAge:prev.tAge,toDate:next.feed,toAge:0,
        days:Math.round((next.feed-prev.transferDate)/86400000),color:ROT_BROOD_COLOR,isTmp:isTmp,
        feedInterval:feedInterval,gapFromDate:prev.transferDate,gapToDate:next.feed});
    }
  });
  return result;
}
function drawRotationLines(ctx,by,W,H){
  var rots=[].concat(calcHouseRotations(),calcBroodRotations());
  rots.forEach(function(r){
    var p1=toXY(r.fromDate,r.fromAge,by),p2=toXY(r.toDate,r.toAge,by);
    var rotHighlight=highlightHouse&&r.label===highlightHouse&&r.color===ROT_HOUSE_COLOR;

    drawDashArrow(ctx,p1.x,p1.y,p2.x,p2.y,r.color,false,rotHighlight?8:5,rotAlpha);

// ── ロット描画 ────────────────────────────────────
function drawLot(ctx,lot,idx,by,W,H,alpha){
  if(lot.hidden)return;
  // 成鶏舎ハイライト
  if(highlightHouse){
    if(lot.house===highlightHouse){alpha=Math.min(alpha*1.2,1);}
    else{alpha=alpha*0.2;}
  }
  var feed=parseDate(lot.feedDate);if(!feed||!lot.outAge)return;
  var age=parseInt(lot.outAge),over=(age>MAX_AGE),dispAge=Math.min(age,MAX_AGE),dispEnd=addDays(feed,dispAge);
  var tAge=clampT((lot.transferAge!==undefined)?lot.transferAge:Math.min(120,dispAge),age);
  var td=addDays(feed,tAge);
  var hasMolt=lot.moltAge&&lot.moltAge>0&&lot.moltAge<dispAge;
  var mS=hasMolt?parseInt(lot.moltAge):null,mE=hasMolt?Math.min(mS+MOLT_DAYS,dispAge):null;
  var IKC=ikuseiColor(lot.brooder),dark=isDark();
  ctx.globalAlpha=alpha;
  // セグメント描画
  var segs=[];
  if(hasMolt){
    var prev=0,cps=[tAge,mS,mE,dispAge].filter(function(v,i,a){return v>0&&v<=dispAge&&a.indexOf(v)===i;}).sort(function(a,b){return a-b;});
    cps.forEach(function(cp){if(cp<=prev)return;var inM=prev>=mS&&prev<mE,inI=prev<tAge;segs.push({s:prev,e:cp,color:inM?MOLT_COLOR:(inI?IKC:lot.color)});prev=cp;});
  } else {segs=[{s:0,e:tAge,color:IKC},{s:tAge,e:dispAge,color:lot.color}];}
  segs.forEach(function(seg){
    if(seg.s>=seg.e)return;
    var sp=toXY(addDays(feed,seg.s),seg.s,by),ep=toXY(addDays(feed,Math.min(seg.e,MAX_AGE)),Math.min(seg.e,MAX_AGE),by);
    ctx.strokeStyle=seg.color;ctx.lineWidth=(highlightHouse&&lot.house===highlightHouse)?4.5:2.5;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(sp.x,sp.y);ctx.lineTo(ep.x,ep.y);ctx.stroke();
  });
  var p1=toXY(feed,0,by),p2=toXY(dispEnd,dispAge,by);

// ── ヒットテスト & ドラッグ ───────────────────────
var cvMain=document.getElementById('cvMain'),tt=document.getElementById('tooltip');

  for(var i=0;i<lots.length;i++){var lot=lots[i];if(lot.hidden)continue;var feed=parseDate(lot.feedDate);if(!feed||!lot.outAge)continue;var age=parseInt(lot.outAge),dA=Math.min(age,MAX_AGE);var tA=clampT((lot.transferAge!==undefined)?lot.transferAge:Math.min(120,dA),age);var pt=toXY(addDays(feed,tA),tA,_by);if(Math.abs(mx-pt.x)<=9&&Math.abs(my-pt.y)<=9)return{type:'transfer',lot:lot};}

    var tf3=parseDate(toriaezu.feedDate);
    dragState={type:hit.type,startX:pos.x,startY:pos.y,origFeed:tf3?new Date(tf3.getTime()):null};
  } else {
    dragState={type:hit.type,id:hit.lot.id};
  }
  document.body.style.cursor='grabbing';e.preventDefault();
});

  else{cvMain.style.cursor='grab';}

function handleDrop(e){e.preventDefault();document.getElementById('drop-zone').classList.remove('drag-over');if(e.dataTransfer.files[0])readCSV(e.dataTransfer.files[0]);}
function handleFileInput(el){if(el.files[0])readCSV(el.files[0]);el.value='';}
function readCSV(file){var r=new FileReader();r.onload=function(e){parseCSV(e.target.result);};r.readAsText(file,'UTF-8');}
function splitCSV(line){var r=[],c='',q=false;for(var i=0;i<line.length;i++){var ch=line[i];if(ch==='"'){q=!q;}else if(ch===','&&!q){r.push(c);c='';}else{c+=ch;}}r.push(c);return r;}
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim()!=='';});
  var added=0,errors=[];
  lines.forEach(function(line,i){
    var cols=splitCSV(line);if(cols.length<3)return;if(i===0&&isNaN(parseInt(cols[2])))return;
    var name=(cols[0]||'').trim(),dateStr=(cols[1]||'').trim().replace(/\//g,'-');
    var dm=dateStr.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(dm)dateStr=dm[1]+'-'+dm[2].padStart(2,'0')+'-'+dm[3].padStart(2,'0');
    var outAge=parseInt((cols[2]||'').trim()),house=(cols[3]||'').trim()||'',brooder=(cols[4]||'').trim()||'',birds=parseInt((cols[5]||'').trim())||0,hatchery=(cols[6]||'').trim()||'',moltAge=parseInt((cols[7]||'').trim())||0;
    var feed=parseDate(dateStr);if(!feed||isNaN(outAge)||outAge<1){errors.push((i+1)+'行目: 無効');return;}
    lots.push({id:nid++,hidden:false,name:name||('ロット'+nid),feedDate:dateStr,outAge:outAge,color:houseColor(house),transferAge:Math.min(120,Math.min(outAge,MAX_AGE)),house:house,brooder:brooder,birds:birds,hatchery:hatchery,moltAge:moltAge||null});
    added++;
  });
  pushUndo();_scrolled=true;redraw();renderLotList();updateHouseList();
  saveToLocal();
  addLog(added+'件のロットを<span class="log-key">CSV読み込み</span>しました');
  var msg=added+'件のロットを読み込みました。';if(errors.length)msg+='\n\nスキップ:\n'+errors.join('\n');alert(msg);
}
function exportCSV(){
  if(!lots.length){alert('ロットがありません');return;}
  var header='ロット名,餌付け日,アウト日齢,成鶏舎,育雛舎,羽数,孵化場,強換開始日齢';
  var rows=lots.map(function(l){return[csvEsc(l.name||''),l.feedDate||'',l.outAge||'',csvEsc(l.house||''),csvEsc(l.brooder||''),l.birds||'',csvEsc(l.hatchery||''),l.moltAge||''].join(',');});
  var csv='\uFEFF'+header+'\n'+rows.join('\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  var d=new Date(),ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  a.href=url;a.download='szk_lots_'+ds+'.csv';document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},100);
}
function csvEsc(s){if(/[,"\n]/.test(s))return'"'+s.replace(/"/g,'""')+'"';return s;}

// ── アンドゥ・リドゥ ─────────────────────────────
var undoStack=[],redoStack=[];

function updateUndoButtons(){
  var bu=document.getElementById('btn-undo'),br=document.getElementById('btn-redo');

  if(br)br.disabled=redoStack.length===0;
}
function undo(){
  if(!undoStack.length)return;
  redoStack.push({lots:snapshotLots(),nid:nid});
  var s=undoStack.pop();lots=s.lots;nid=s.nid;
  editingId=null;_scrolled=true;redraw();renderLotList();updateHouseList();updateUndoButtons();
  addLog('↩ <span class="log-key">元に戻しました</span>');
}
function redo(){
  if(!redoStack.length)return;
  undoStack.push({lots:snapshotLots(),nid:nid});
  var s=redoStack.pop();lots=s.lots;nid=s.nid;
  editingId=null;_scrolled=true;redraw();renderLotList();updateHouseList();updateUndoButtons();
  addLog('↪ <span class="log-key">やり直しました</span>');
}
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key==='z'){e.preventDefault();undo();}
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.shiftKey&&e.key==='z'))){e.preventDefault();redo();}
});

// ── Supabase 保存・読み込み ─────────────────────
var LS_KEY='szk_lots_v1';
function saveToLocal(){
  // ロットをSupabaseに一括upsert
  var rows = lots.map(function(l){
    return {
      id: typeof l.id === 'string' ? l.id : undefined,
      lot_name: l.name || '',
      feed_date: l.feedDate || null,
      out_age: parseInt(l.outAge) || 0,
      seikei_house: l.house || null,
      ikusei_house: l.brooder || null,
      bird_count: l.birds ? parseInt(l.birds) : null,
      hatchery: l.hatchery || null,
      molt: l.moltAge ? true : false,
      molt_age: l.moltAge ? parseInt(l.moltAge) : null,
      color: l.color || null,
      transfer_age: l.transferAge !== undefined ? parseInt(l.transferAge) : null,
      hidden: l.hidden || false,
      local_id: typeof l.id === 'number' ? l.id : null
    };
  });
  if(rows.length > 0){
    sb.from('rotation_lots').upsert(rows, {onConflict: 'id'}).then(function(res){
      if(res.error) console.error('save error:', res.error);
    });
  }
  // annotationsはlocalStorageに保存
  try{localStorage.setItem('szk_rote_annotations', JSON.stringify(annotations));}catch(e){}
  try{localStorage.setItem('szk_rote_nid', String(nid));}catch(e){}
}
async function loadFromSupabase(){
  var res = await sb.from('rotation_lots').select('*').order('created_at');
  if(res.error || !res.data || res.data.length === 0) return false;
  lots = res.data.map(function(r){
    return {
      id: r.id,
      name: r.lot_name,
      feedDate: r.feed_date,
      outAge: r.out_age,
      house: r.seikei_house || '',
      brooder: r.ikusei_house || '',
      birds: r.bird_count || '',
      hatchery: r.hatchery || '',
      moltAge: r.molt && r.molt_age ? r.molt_age : null,
      color: r.color || '#1D9E75',
      transferAge: r.transfer_age !== null ? r.transfer_age : Math.min(120, r.out_age),
      hidden: r.hidden || false
    };
  });
  nid = lots.length + 1;
  try{annotations = JSON.parse(localStorage.getItem('szk_rote_annotations') || '[]');}catch(e){annotations=[];}
  return true;
}
function loadFromLocal(){
  try{
    var data=localStorage.getItem(LS_KEY);
    if(!data)return false;
    var obj=JSON.parse(data);
    if(obj.lots&&obj.lots.length){
      lots=obj.lots;nid=obj.nid||nid;
      if(obj.annotations)annotations=obj.annotations;
      // hidden/color/transferAgeの補完
      lots.forEach(function(l){
        if(l.hidden===undefined)l.hidden=false;
        if(!l.color)l.color=houseColor(l.house);
        if(l.transferAge===undefined)l.transferAge=Math.min(120,Math.min(parseInt(l.outAge)||120,MAX_AGE));
      });
      return true;
    }
  }catch(e){}
  return false;
}

function changeZoom(dir){
  var levels=[0.25,0.33,0.5,0.67,0.75,1.0];
  var idx=levels.indexOf(zoomLevel);
  if(idx===-1)idx=levels.length-1;
  idx=Math.max(0,Math.min(levels.length-1,idx+dir));
  zoomLevel=levels[idx];
  CW=Math.round(38*zoomLevel);
  // CH は縦固定（38px）のまま変えない
  document.getElementById('zoom-lbl').textContent=Math.round(zoomLevel*100)+'%';
  _scrolled=true;redraw();
}




// ── 注釈機能 ─────────────────────────────────────────
function toggleAnnotMode(){
  annotMode=!annotMode;
  var btn=document.getElementById('btn-annot');
  if(btn)btn.className='btn-rotation '+(annotMode?'on':'off');
  cvMain.style.cursor=annotMode?'crosshair':'default';
}

function getAnnotW(text){
  var tmp=document.createElement('canvas').getContext('2d');
  var annotFs=Math.max(8,Math.round(13*zoomLevel));tmp.font='bold '+annotFs+'px monospace';
  return tmp.measureText(text).width+12;
}

function hitAnnot(pos){
  for(var i=annotations.length-1;i>=0;i--){
    var a=annotations[i],th=22,tw=getAnnotW(a.text);
    if(pos.x>=a.x&&pos.x<=a.x+tw&&pos.y>=a.y-th+4&&pos.y<=a.y+4)return i;
  }
  return -1;
}

function drawAnnotations(ctx){
  annotations.forEach(function(a){
    var annotFs=Math.max(8,Math.round(13*zoomLevel));ctx.font='bold '+annotFs+'px monospace';
    var tw=getAnnotW(a.text),th=22;
    ctx.fillStyle='rgba(255,255,255,0.93)';
    ctx.strokeStyle='#E24B4A';ctx.lineWidth=1.5;ctx.setLineDash([]);
    rrect(ctx,a.x,a.y-th+4,tw,th,3);ctx.fill();ctx.stroke();
    ctx.fillStyle='#E24B4A';ctx.textAlign='left';ctx.font='bold '+annotFs+'px monospace';
    ctx.fillText(a.text,a.x+6,a.y);
  });
}

// クリックで注釈追加（注釈モードON時）
cvMain.addEventListener('click',function(e){
  // ハイライト解除（表示モード＋舎繰り線ON）
  if(!editMode&&showRotation&&highlightHouse){highlightHouse=null;redraw();return;}
  if(!annotMode||!editMode)return;
  if(annotDrag&&annotDrag.moved)return; // ドラッグ後はスキップ
  var pos=getCanvasXY(e);
  if(hitAnnot(pos)>=0)return; // 既存注釈クリックは無視
  var text=prompt('注釈テキストを入力');
  if(!text||!text.trim())return;
  annotations.push({id:Date.now(),x:pos.x,y:pos.y,text:text.trim()});
  saveToLocal();redraw();
});

// 右クリックで削除
cvMain.addEventListener('contextmenu',function(e){
  if(!editMode)return;
  var pos=getCanvasXY(e);
  var idx=hitAnnot(pos);
  if(idx>=0){
    e.preventDefault();
    if(confirm('"'+annotations[idx].text+'" を削除しますか？')){
      annotations.splice(idx,1);saveToLocal();redraw();
    }
  }
});

// 注釈ドラッグ
cvMain.addEventListener('mousedown',function(e){
  if(!editMode)return;
  var pos=getCanvasXY(e);
  var idx=hitAnnot(pos);
  if(idx>=0){
    annotDrag={idx:idx,ox:pos.x-annotations[idx].x,oy:pos.y-annotations[idx].y,moved:false};
    e.stopImmediatePropagation();
    document.body.style.cursor='grabbing';
    e.preventDefault();
    return;
  }
});
document.addEventListener('mousemove',function(e){
  if(!annotDrag)return;
  var pos=getCanvasXY(e);
  annotations[annotDrag.idx].x=pos.x-annotDrag.ox;
  annotations[annotDrag.idx].y=pos.y-annotDrag.oy;
  annotDrag.moved=true;
  redraw();
});
document.addEventListener('mouseup',function(e){
  if(!annotDrag)return;
  if(annotDrag.moved)saveToLocal();
  annotDrag=null;
  document.body.style.cursor='';
});


// ── x軸ホバー：日齢表示 ──────────────────────────────
document.getElementById('xaxis-top').addEventListener('mousemove',function(e){
  var tip=document.getElementById('axis-tip');
  var rect=this.getBoundingClientRect();
  var px=e.clientX-rect.left+scroll.scrollLeft;
  var col=px/CW,ci=Math.floor(col);
  var yr=_by+Math.floor(ci/12),mo=((ci%12)+12)%12;
  var frac=col-ci,d=dim(yr,mo),day=Math.max(1,Math.min(d,Math.round(frac*d)+1));
  var hoverDate=new Date(yr,mo,day);

  var byHouse={},byBrood={};
  lots.forEach(function(l){
    if(l.hidden)return;
    var feed=parseDate(l.feedDate);if(!feed||!l.outAge)return;
    var age=Math.round((hoverDate-feed)/86400000);
    if(age<0||age>parseInt(l.outAge))return;
    var dispAge=Math.min(parseInt(l.outAge),MAX_AGE);
    var tAge=clampT((l.transferAge!==undefined)?l.transferAge:Math.min(120,dispAge),parseInt(l.outAge));
    var label=l.name||('ロット'+l.id);
    if(age<tAge){
      // 移動日前 → 育雛舎
      var brood=l.brooder||'未設定';
      byBrood[brood]=byBrood[brood]||[];
      byBrood[brood].push({name:label,age:age,color:l.color,isTransfer:false});
    } else if(age===tAge){
      // 移動日当日 → 育雛舎に「移動」表示
      var brood=l.brooder||'未設定';
      byBrood[brood]=byBrood[brood]||[];
      byBrood[brood].push({name:label,age:age,color:l.color,isTransfer:true});
    } else {
      // 移動日以降 → 成鶏舎
      var house=l.house||'未設定';
      byHouse[house]=byHouse[house]||[];
      byHouse[house].push({name:label,age:age,color:l.color,isTransfer:false,isOut:(age===parseInt(l.outAge))});
    }
  });

  var hasData=Object.keys(byHouse).length>0||Object.keys(byBrood).length>0;
  if(!hasData){tip.style.display='none';return;}

  var dark=isDark();
  var html='<div style="font-weight:500;margin-bottom:6px;color:'+(dark?'#e2e8f0':'#374151')+';border-bottom:0.5px solid rgba(0,0,0,0.1);padding-bottom:4px">'+
    hoverDate.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'})+'</div>';

  if(Object.keys(byHouse).length){
    html+='<div style="font-size:10px;color:#6b7280;margin-bottom:3px">成鶏舎</div>';
    Object.keys(byHouse).sort().forEach(function(h){
      byHouse[h].forEach(function(e){
        var marker=e.isOut?'<span style="color:#E24B4A;font-weight:700;margin-left:6px">アウト</span>':
                   e.isTransfer?'<span style="color:#E24B4A;font-weight:700;margin-left:6px">移動</span>':'';
        var ageStyle=e.isOut||e.isTransfer?'font-family:monospace;color:#E24B4A;font-weight:700':'font-family:monospace;color:'+(dark?'#e2e8f0':'#111');
        html+='<div style="display:flex;justify-content:space-between;gap:16px;margin:2px 0;align-items:center">'+
          '<span style="color:'+e.color+';font-weight:500">'+h+' '+e.name+'</span>'+
          '<span style="'+ageStyle+'">'+e.age+'日齢'+marker+'</span></div>';
      });
    });
  }
  if(Object.keys(byBrood).length){
    html+='<div style="font-size:10px;color:#6b7280;margin:'+(Object.keys(byHouse).length?'6px':'0')+'px 0 3px">育雛舎</div>';
    Object.keys(byBrood).sort().forEach(function(b){
      byBrood[b].forEach(function(e){
        var ikc=b==='2号'?'#60b3f0':b==='1号'?'#f59e0b':'#aaaaaa';
        var marker=e.isTransfer?'<span style="color:#E24B4A;font-weight:700;margin-left:6px">移動</span>':'';
        var ageStyle=e.isTransfer?'font-family:monospace;color:#E24B4A;font-weight:700':'font-family:monospace;color:'+(dark?'#e2e8f0':'#111');
        html+='<div style="display:flex;justify-content:space-between;gap:16px;margin:2px 0;align-items:center">'+
          '<span style="color:'+ikc+';font-weight:500">育雛'+b+' '+e.name+'</span>'+
          '<span style="'+ageStyle+'">'+e.age+'日齢'+marker+'</span></div>';
      });
    });
  }

  tip.innerHTML=html;
  tip.style.background=dark?'#1e2535':'#fff';
  tip.style.display='block';
  var tipX=e.clientX+12,tipY=e.clientY+12;
  if(tipX+220>window.innerWidth)tipX=e.clientX-220;
  if(tipY+200>window.innerHeight)tipY=e.clientY-200;
  tip.style.left=tipX+'px';
  tip.style.top=tipY+'px';
});
document.getElementById('xaxis-top').addEventListener('mouseleave',function(){
  document.getElementById('axis-tip').style.display='none';
});

// ── 下の日付軸ホバー ──────────────────────────────
window.addEventListener('load', function(){
  var xbot=document.getElementById('xaxis-bot');
  xbot.style.pointerEvents='auto';
  var _ftTip=document.getElementById('farm-tip');
  var _ftTimer=null;
  var _lastDs='';
  xbot.addEventListener('mousemove',function(e){
    var rect=xbot.getBoundingClientRect();
    var px=e.clientX-rect.left+scroll.scrollLeft;
    var date=posToDate(px,_by);
    var ds=date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
    var mo=date.getFullYear()+'年'+(date.getMonth()+1)+'月'+date.getDate()+'日';
    _ftTip.style.display='block';
    _ftTip.style.left=(e.clientX+12)+'px';
    _ftTip.style.top=(e.clientY-220)+'px';
    if(ds===_lastDs)return;
    _lastDs=ds;
    _ftTip.innerHTML='<div class="ft-title">📅 '+mo+'</div><div style="color:#aaa;font-size:10px;">読み込み中...</div>';
    if(_ftTimer)clearTimeout(_ftTimer);
    _ftTimer=setTimeout(function(){
      fetch((window.KEIRYO_API||'http://localhost:3001')+'/api/farm-perf/'+ds)
        .then(function(r){return r.json();})
        .then(function(d){
          if(!d.ok||!d.lots.length){_ftTip.innerHTML='<div class="ft-title">'+mo+'</div><div style="color:#aaa;font-size:10px;">データなし</div>';return;}
          var html='<div class="ft-title">📅 '+mo+'</div>';
          var te=0,tc=0,tw=0;
          d.lots.forEach(function(l){
            var hc=HOUSE_COLORS[(l.house||'')+'舎']||'#888';
            html+='<div class="ft-row">';
            html+='<span class="ft-lot" style="color:'+hc+';font-weight:600;">●'+l.lot+'（'+l.house+'）</span>';
            html+='<span class="ft-val">'+(l.rate!==null?l.rate.toFixed(1)+'%  ':'')+(l.eggW!==null?l.eggW.toFixed(1)+'g  ':'')+l.eggs.toLocaleString()+'個  '+l.current.toLocaleString()+'羽</span>';
            html+='</div>';
            te+=l.eggs;tc+=l.current;tw+=l.totalW;
          });
          var tr=tc>0?te/tc*100:0,tew=te>0?tw/te*1000:0;
          html+='<div class="ft-row ft-total"><span class="ft-lot">合計</span>';
          html+='<span class="ft-val">'+tr.toFixed(1)+'%  '+tew.toFixed(1)+'g  '+te.toLocaleString()+'個  '+tc.toLocaleString()+'羽</span></div>';
          _ftTip.innerHTML=html;
        }).catch(function(){_ftTip.style.display='none';});
    },300);
  });
  xbot.addEventListener('mouseleave',function(){
    if(_ftTimer)clearTimeout(_ftTimer);
    _ftTip.style.display='none';
    _lastDs='';
  });
});
