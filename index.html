<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SZK動態表</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: #f0f2f5;
      color: #111;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f1117; color: #e2e8f0; }
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      border: 0.5px solid rgba(0,0,0,0.15);
      overflow: hidden;
      background: #fff;
    }
    @media (prefers-color-scheme: dark) {
      #app { background: #1a1f2e; border-color: rgba(255,255,255,0.15); }
    }

    .hdr {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 0.5px solid rgba(0,0,0,0.12);
      background: #f8f9fb;
      flex-shrink: 0;
    }
    @media (prefers-color-scheme: dark) {
      .hdr { background: #1e2535; border-color: rgba(255,255,255,0.12); }
    }
    .hdr-title { font-size: 16px; font-weight: 500; letter-spacing: .04em; }
    .hdr-legend { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 11px; color: #6b7280; }

    .body { display: flex; flex: 1; overflow: hidden; }

    .side {
      width: 220px;
      flex-shrink: 0;
      border-right: 0.5px solid rgba(0,0,0,0.10);
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f8f9fb;
    }
    @media (prefers-color-scheme: dark) {
      .side { background: #1e2535; border-color: rgba(255,255,255,0.10); }
    }
    .sec-lbl { font-size: 11px; font-weight: 500; color: #6b7280; letter-spacing: .06em; margin-bottom: 5px; }
    .form-row { display: flex; flex-direction: column; gap: 3px; margin-bottom: 7px; }
    .form-row label { font-size: 11px; color: #6b7280; }
    .form-row input {
      font-size: 12px; padding: 5px 8px;
      border: 0.5px solid rgba(0,0,0,0.2);
      border-radius: 6px;
      background: #fff;
      color: #111;
      outline: none; width: 100%;
      font-family: inherit;
    }
    @media (prefers-color-scheme: dark) {
      .form-row input { background: #161b27; color: #e2e8f0; border-color: rgba(255,255,255,0.2); }
    }
    .form-row input:focus { border-color: #1D9E75; }
    .btn-add {
      width: 100%; padding: 8px;
      background: #1D9E75; color: #fff;
      border: none; border-radius: 6px;
      font-size: 12px; font-weight: 500;
      cursor: pointer; font-family: inherit;
      margin-top: 4px;
    }
    .btn-add:hover { background: #0F6E56; }

    .lot-item {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 7px;
      background: #fff;
      border: 0.5px solid rgba(0,0,0,0.10);
      border-radius: 6px; margin-bottom: 4px;
    }
    @media (prefers-color-scheme: dark) {
      .lot-item { background: #161b27; border-color: rgba(255,255,255,0.10); }
    }
    .lot-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .lot-name { font-size: 11px; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lot-meta { font-size: 10px; font-family: monospace; flex-shrink: 0; }
    .btn-del { background: none; border: none; cursor: pointer; font-size: 12px; color: #6b7280; padding: 0 2px; }
    .btn-del:hover { color: #E24B4A; }

    .warn-banner {
      background: rgba(224,92,92,0.12);
      border: 0.5px solid rgba(224,92,92,0.4);
      border-radius: 6px; padding: 6px 10px;
      font-size: 11px; color: #E24B4A; display: none;
    }
    .drag-hint {
      font-size: 10px; color: #6b7280; line-height: 1.7;
      margin-top: auto; padding-top: 8px;
      border-top: 0.5px solid rgba(0,0,0,0.10);
    }
    @media (prefers-color-scheme: dark) {
      .drag-hint { border-color: rgba(255,255,255,0.10); }
    }

    .chart-outer { flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative; }
    .xaxis-top { position: absolute; top: 0; right: 0; overflow: hidden; z-index: 10; pointer-events: none; }
    .xaxis-bot { position: absolute; bottom: 0; right: 0; overflow: hidden; z-index: 10; pointer-events: none; }
    .corner-tl { position: absolute; top: 0; left: 0; z-index: 20; }
    .corner-bl { position: absolute; bottom: 0; left: 0; z-index: 20; }
    .chart-mid { position: absolute; left: 0; right: 0; display: flex; overflow: hidden; }
    .yaxis-wrap { overflow: hidden; flex-shrink: 0; position: relative; z-index: 10; }
    .chart-scroll { flex: 1; overflow: auto; position: relative; }

    .tt {
      position: absolute; display: none;
      background: #fff;
      border: 0.5px solid rgba(0,0,0,0.2);
      border-radius: 8px; padding: 8px 12px;
      font-size: 12px; pointer-events: none;
      z-index: 50; min-width: 165px;
      box-shadow: 0 2px 8px rgba(0,0,0,.10);
    }
    @media (prefers-color-scheme: dark) {
      .tt { background: #1e2535; border-color: rgba(255,255,255,0.2); }
    }
    .tt-name { font-weight: 500; margin-bottom: 5px; padding-bottom: 5px; border-bottom: 0.5px solid rgba(0,0,0,0.10); }
    @media (prefers-color-scheme: dark) {
      .tt-name { border-color: rgba(255,255,255,0.10); }
    }
    .tt-r { display: flex; justify-content: space-between; gap: 12px; color: #6b7280; margin-top: 3px; font-size: 11px; }
    .tt-r b { color: #1D9E75; }
    .tt-r .red { color: #E24B4A; font-weight: 500; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
    @media (prefers-color-scheme: dark) {
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }
    }
  </style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="hdr-title">SZK動態表</div>
    <div class="hdr-legend">
      <span><span style="display:inline-block;width:22px;height:3px;background:#f59e0b;border-radius:2px;vertical-align:middle"></span> 育成期</span>
      <span><span style="display:inline-block;width:10px;height:10px;border:2px solid #888;vertical-align:middle"></span> 移動日(上限150日)</span>
      <span><span style="display:inline-block;width:16px;height:2px;background:#E24B4A;border-radius:1px;vertical-align:middle"></span> 今日</span>
    </div>
  </div>
  <div class="body">
    <div class="side">
      <div>
        <div class="sec-lbl">ロット登録</div>
        <div class="form-row"><label>ロット名</label><input id="f-name" placeholder="例: A棟-春" maxlength="16"></div>
        <div class="form-row"><label>餌付け日 *</label><input id="f-date" type="date"></div>
        <div class="form-row"><label>アウト日齢 *</label><input id="f-age" type="number" placeholder="例: 500" min="1" max="999"></div>
        <div class="warn-banner" id="age-warn">⚠ 690日齢を超えています</div>
        <button class="btn-add" onclick="addLot()">＋ ロット追加</button>
      </div>
      <div>
        <div class="sec-lbl">登録済みロット</div>
        <div id="lot-list"></div>
      </div>
      <div class="drag-hint">
        <b>矢印先端</b>ドラッグ → アウト日齢変更<br>
        <b>四角マーカー</b>ドラッグ → 移動日変更(最大150日)<br>
        横スクロールで過去・未来へ
      </div>
    </div>

    <div class="chart-outer" id="chart-outer">
      <canvas id="cvCornerTL" class="corner-tl"></canvas>
      <canvas id="cvCornerBL" class="corner-bl"></canvas>
      <div class="xaxis-top" id="xaxis-top"><canvas id="cvXTop"></canvas></div>
      <div class="xaxis-bot" id="xaxis-bot"><canvas id="cvXBot"></canvas></div>
      <div class="chart-mid" id="chart-mid">
        <div class="yaxis-wrap" id="yaxis-wrap"><canvas id="cvY"></canvas></div>
        <div class="chart-scroll" id="chart-scroll">
          <canvas id="cvMain"></canvas>
          <div class="tt" id="tooltip">
            <div class="tt-name" id="tt-name"></div>
            <div id="tt-body"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var COLORS=['#1D9E75','#7F77DD','#BA7517','#D4537E','#185FA5','#D85A30','#639922','#993556','#534AB7','#0F6E56'];
var IKUSEI='#f59e0b';
var CW=38,CH=38,YW=72,XH=44;
var MAX_AGE=690;
var MAX_TRANSFER=150;
var ROWS=Math.ceil(MAX_AGE/30);
var DPR=Math.min(window.devicePixelRatio||1,2);
var lots=[],nid=1,dragState=null,VIEW_COLS=120;

function parseDate(s){if(!s)return null;var d=new Date(s+'T00:00:00');return isNaN(d.getTime())?null:d;}
function addDays(d,n){var r=new Date(d.getTime());r.setDate(r.getDate()+n);return r;}
function dim(y,m){return new Date(y,m+1,0).getDate();}
function getBaseYear(){
  var y=new Date().getFullYear()-1;
  lots.forEach(function(l){var d=parseDate(l.feedDate);if(d&&d.getFullYear()<y)y=d.getFullYear();});
  return y;
}
function getNeededCols(){
  var maxCol=VIEW_COLS,base=getBaseYear();
  lots.forEach(function(l){
    var feed=parseDate(l.feedDate);if(!feed||!l.outAge)return;
    var end=addDays(feed,parseInt(l.outAge));
    var col=(end.getFullYear()-base)*12+end.getMonth()+3;
    if(col>maxCol)maxCol=col;
  });
  return Math.max(VIEW_COLS,maxCol);
}
function clampTransfer(tAge,outAge){
  return Math.max(1,Math.min(MAX_TRANSFER,Math.min(Math.min(outAge,MAX_AGE),tAge)));
}
function toXY(date,age,baseYear){
  var col=(date.getFullYear()-baseYear)*12+date.getMonth();
  var frac=(date.getDate()-1)/dim(date.getFullYear(),date.getMonth());
  var dispAge=Math.min(age,MAX_AGE);
  return{x:(col+frac)*CW,y:(ROWS-dispAge/30)*CH};
}
function posToDate(px,baseYear){
  var col=px/CW,ci=Math.floor(col);
  var yr=baseYear+Math.floor(ci/12),mo=((ci%12)+12)%12;
  var dm=dim(yr,mo),day=Math.max(1,Math.min(dm,Math.round((col-ci)*dm)+1));
  return new Date(yr,mo,day);
}
function posToAge(py){return Math.max(1,Math.min(MAX_AGE,Math.round((ROWS-py/CH)*30)));}
function isDark(){return matchMedia('(prefers-color-scheme:dark)').matches;}
function setupCv(id,w,h){
  var el=document.getElementById(id);
  el.width=Math.round(w*DPR);el.height=Math.round(h*DPR);
  el.style.width=w+'px';el.style.height=h+'px';
  var ctx=el.getContext('2d');ctx.scale(DPR,DPR);return ctx;
}
function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function drawCorner(cvId,isTop){
  var dark=isDark(),bg=dark?'#1e2535':'#f0f2f5',bd=dark?'rgba(255,255,255,0.2)':'rgba(0,0,0,0.2)';
  var ctx=setupCv(cvId,YW,XH);
  ctx.fillStyle=bg;ctx.fillRect(0,0,YW,XH);
  ctx.strokeStyle=bd;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(YW,0);ctx.lineTo(YW,XH);ctx.stroke();
  if(isTop){ctx.beginPath();ctx.moveTo(0,XH);ctx.lineTo(YW,XH);ctx.stroke();}
  else{ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(YW,0);ctx.stroke();}
  ctx.font='10px monospace';ctx.fillStyle=dark?'#9ca3af':'#6b7280';
  ctx.textAlign='center';ctx.fillText('日齢',YW/2,XH/2+4);
}

function drawXAxis(cvId,baseYear,COLS,isTop){
  var dark=isDark(),ts=dark?'#9ca3af':'#6b7280',bg=dark?'#1e2535':'#f0f2f5',bd=dark?'rgba(255,255,255,0.2)':'rgba(0,0,0,0.2)';
  var W=COLS*CW,H=XH;
  var ctx=setupCv(cvId,W,H);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=bd;ctx.lineWidth=1;
  if(isTop){ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(W,H);ctx.stroke();}
  else{ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.stroke();}
  var prevY=null;
  for(var i=0;i<COLS;i++){
    var yr=baseYear+Math.floor(i/12),mo=i%12,x=i*CW;
    ctx.font='10px monospace';ctx.fillStyle=ts;ctx.textAlign='center';
    ctx.fillText(mo+1,x+CW/2,H-8);
    if(yr!==prevY){
      ctx.font='500 11px monospace';ctx.fillStyle='#1D9E75';ctx.textAlign='left';
      ctx.fillText(yr,x+3,isTop?H-26:22);prevY=yr;
    }
    ctx.strokeStyle=i%12===0?bd:dark?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.07)';
    ctx.lineWidth=i%12===0?1.5:.5;
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  var today=new Date();
  var tci=(today.getFullYear()-baseYear)*12+today.getMonth();
  if(tci>=0&&tci<COLS){
    var tf=(today.getDate()-1)/dim(today.getFullYear(),today.getMonth());
    var tx=(tci+tf)*CW;
    ctx.strokeStyle='#E24B4A';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.globalAlpha=.75;
    ctx.beginPath();ctx.moveTo(tx,0);ctx.lineTo(tx,H);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;
    ctx.font='9px monospace';ctx.fillStyle='#E24B4A';ctx.textAlign='left';
    ctx.fillText('今日',tx+3,H-8);
  }
}

function drawY(){
  var dark=isDark(),ts=dark?'#9ca3af':'#6b7280',bg=dark?'#1e2535':'#f0f2f5',bd=dark?'rgba(255,255,255,0.2)':'rgba(0,0,0,0.2)';
  var H=ROWS*CH,W=YW;
  var ctx=setupCv('cvY',W,H);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=dark?'rgba(59,130,246,0.12)':'rgba(59,130,246,0.10)';
  ctx.fillRect(0,H-4*CH,W,4*CH);
  ctx.strokeStyle=bd;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(W,H);ctx.stroke();
  ctx.font='9px monospace';ctx.fillStyle=ts;ctx.textAlign='right';
  for(var r=0;r<ROWS;r++){
    var y=(ROWS-r-1)*CH+CH/2+4;
    ctx.fillText((r*30+1)+'-'+((r+1)*30),W-5,y);
    ctx.strokeStyle=dark?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.07)';ctx.lineWidth=.5;
    ctx.beginPath();ctx.moveTo(0,(ROWS-r)*CH);ctx.lineTo(W,(ROWS-r)*CH);ctx.stroke();
  }
  var dly=(ROWS-4)*CH;
  ctx.strokeStyle=dark?'rgba(59,130,246,0.85)':'rgba(37,99,235,0.75)';ctx.lineWidth=1.5;ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(0,dly);ctx.lineTo(W,dly);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,dly+3);ctx.lineTo(W,dly+3);ctx.stroke();
}

function drawMain(baseYear,COLS){
  var dark=isDark();
  var gc=dark?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.07)';
  var gs=dark?'rgba(255,255,255,0.18)':'rgba(0,0,0,0.18)';
  var bgN=dark?'rgba(255,255,255,0.02)':'rgba(0,0,0,0.015)';
  var bg=dark?'#1a1f2e':'#f8f9fb';
  var W=COLS*CW,H=ROWS*CH;
  var ctx=setupCv('cvMain',W,H);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=dark?'rgba(59,130,246,0.10)':'rgba(59,130,246,0.08)';
  ctx.fillRect(0,H-4*CH,W,4*CH);
  for(var r=4;r<ROWS;r++){
    if(r%2===0){ctx.fillStyle=bgN;ctx.fillRect(0,(ROWS-r-1)*CH,W,CH);}
  }
  for(var i=0;i<=COLS;i++){
    ctx.strokeStyle=i%12===0?gs:gc;ctx.lineWidth=i%12===0?1.5:.5;
    ctx.beginPath();ctx.moveTo(i*CW,0);ctx.lineTo(i*CW,H);ctx.stroke();
  }
  for(var r=0;r<=ROWS;r++){
    ctx.strokeStyle=r===0?gs:gc;ctx.lineWidth=r===0?1.5:.5;
    ctx.beginPath();ctx.moveTo(0,r*CH);ctx.lineTo(W,r*CH);ctx.stroke();
  }
  var dly=(ROWS-4)*CH;
  ctx.strokeStyle=dark?'rgba(59,130,246,0.8)':'rgba(37,99,235,0.70)';ctx.lineWidth=1.5;ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(0,dly);ctx.lineTo(W,dly);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,dly+3);ctx.lineTo(W,dly+3);ctx.stroke();
  var today=new Date();
  var tci=(today.getFullYear()-baseYear)*12+today.getMonth();
  if(tci>=0&&tci<COLS){
    var tf=(today.getDate()-1)/dim(today.getFullYear(),today.getMonth());
    var tx=(tci+tf)*CW;
    ctx.strokeStyle='#E24B4A';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.globalAlpha=.75;
    ctx.beginPath();ctx.moveTo(tx,0);ctx.lineTo(tx,H);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;
  }

  lots.forEach(function(lot,idx){
    var feed=parseDate(lot.feedDate);if(!feed||!lot.outAge)return;
    var age=parseInt(lot.outAge);
    var over=(age>MAX_AGE);
    var dispAge=Math.min(age,MAX_AGE);
    var dispEnd=addDays(feed,dispAge);
    var tAge=clampTransfer((lot.transferAge!==undefined)?lot.transferAge:Math.min(120,dispAge),age);
    var td=addDays(feed,tAge);
    var p1=toXY(feed,0,baseYear),pt=toXY(td,tAge,baseYear),p2=toXY(dispEnd,dispAge,baseYear);

    ctx.strokeStyle=IKUSEI;ctx.lineWidth=2.5;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(pt.x,pt.y);ctx.stroke();
    ctx.strokeStyle=lot.color;ctx.lineWidth=2.5;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(pt.x,pt.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();

    if(over){
      ctx.strokeStyle=lot.color;ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.globalAlpha=.5;
      var ang0=Math.atan2(p2.y-p1.y,p2.x-p1.x);
      ctx.beginPath();ctx.moveTo(p2.x,p2.y);
      ctx.lineTo(p2.x+Math.cos(ang0)*28,p2.y+Math.sin(ang0)*28);ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=1;
    }

    var ang=Math.atan2(p2.y-p1.y,p2.x-p1.x),hs=9;
    ctx.fillStyle=lot.color;
    ctx.beginPath();
    ctx.moveTo(p2.x,p2.y);
    ctx.lineTo(p2.x-hs*Math.cos(ang-0.4),p2.y-hs*Math.sin(ang-0.4));
    ctx.lineTo(p2.x-hs*Math.cos(ang+0.4),p2.y-hs*Math.sin(ang+0.4));
    ctx.closePath();ctx.fill();

    ctx.fillStyle=IKUSEI;
    ctx.beginPath();ctx.arc(p1.x,p1.y,4,0,Math.PI*2);ctx.fill();

    var midAge=Math.round(dispAge/2);
    var pm=toXY(addDays(feed,midAge),midAge,baseYear);
    ctx.font='500 11px monospace';
    ctx.fillStyle=midAge<=tAge?IKUSEI:lot.color;
    ctx.textAlign='center';
    ctx.fillText(lot.name||('L'+(idx+1)),pm.x,pm.y-9);

    var sq=6,isDT=dragState&&dragState.type==='transfer'&&dragState.id===lot.id;
    var atLimit=(tAge>=MAX_TRANSFER);
    ctx.fillStyle=dark?'#1a1f2e':'#ffffff';
    ctx.strokeStyle=atLimit?'#E24B4A':lot.color;
    ctx.lineWidth=isDT?3:2.5;ctx.setLineDash([]);
    ctx.beginPath();ctx.rect(pt.x-sq,pt.y-sq,sq*2,sq*2);ctx.fill();ctx.stroke();
    if(isDT){
      ctx.strokeStyle=atLimit?'#E24B4A':lot.color;ctx.lineWidth=1.5;ctx.globalAlpha=.35;
      ctx.beginPath();ctx.arc(pt.x,pt.y,11,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=1;
    }

    var ds=td.toLocaleDateString('ja-JP',{year:'2-digit',month:'numeric',day:'numeric'});
    var as=tAge+'日齢'+(atLimit?' (上限)':''),fs=12;
    ctx.font='500 '+fs+'px monospace';
    var lw=Math.max(ctx.measureText(ds).width,ctx.measureText(as).width)+12,lh=fs*2+12;
    var lx=pt.x-lw/2,ly=pt.y-lh-10;
    if(ly<0)ly=pt.y+sq+6;
    if(lx+lw>W)lx=W-lw-2;if(lx<0)lx=2;
    ctx.fillStyle=dark?'rgba(20,25,40,0.92)':'rgba(255,255,255,0.95)';
    ctx.strokeStyle='#E24B4A';ctx.lineWidth=1.5;ctx.setLineDash([]);
    rrect(ctx,lx,ly,lw,lh,3);ctx.fill();ctx.stroke();
    ctx.fillStyle='#E24B4A';ctx.textAlign='left';
    ctx.font='500 '+fs+'px monospace';ctx.fillText(as,lx+6,ly+fs+1);
    ctx.font='500 '+(fs-1)+'px monospace';ctx.fillText(ds,lx+6,ly+fs*2+5);

    var l1=over?(age+'日齢 ⚠超過'):age+'日齢';
    var l2=addDays(feed,age).toLocaleDateString('ja-JP',{year:'2-digit',month:'numeric',day:'numeric'}),fs2=13;
    ctx.font='500 '+fs2+'px monospace';
    var bw=Math.max(ctx.measureText(l1).width,ctx.measureText(l2).width)+14,bh=fs2*2+14;
    var bx=p2.x+Math.cos(ang)*8,by=p2.y+Math.sin(ang)*8;
    if(bx+bw>W)bx=p2.x-bw-4;
    if(by+bh>H)by=p2.y-bh-4;if(by<0)by=p2.y+4;
    ctx.fillStyle=dark?'rgba(20,25,40,0.92)':'rgba(255,255,255,0.95)';
    ctx.strokeStyle='#E24B4A';ctx.lineWidth=1.5;ctx.setLineDash([]);
    rrect(ctx,bx,by,bw,bh,4);ctx.fill();ctx.stroke();
    ctx.fillStyle='#E24B4A';ctx.textAlign='left';
    ctx.font='500 '+fs2+'px monospace';ctx.fillText(l1,bx+7,by+fs2+2);
    ctx.font='500 '+(fs2-1)+'px monospace';ctx.fillText(l2,bx+7,by+fs2*2+6);

    if(dragState&&dragState.type==='arrow'&&dragState.id===lot.id){
      ctx.strokeStyle=lot.color;ctx.lineWidth=2;ctx.globalAlpha=.4;
      ctx.beginPath();ctx.arc(p2.x,p2.y,11,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=1;
    }
  });
}

var _baseYear=null,_COLS=null,_scrolledToToday=false;
function redraw(){
  _baseYear=getBaseYear();_COLS=getNeededCols();
  drawCorner('cvCornerTL',true);drawCorner('cvCornerBL',false);
  drawXAxis('cvXTop',_baseYear,_COLS,true);
  drawXAxis('cvXBot',_baseYear,_COLS,false);
  drawY();drawMain(_baseYear,_COLS);
  if(!_scrolledToToday){
    var sc=document.getElementById('chart-scroll');
    var today=new Date();
    var tci=(today.getFullYear()-_baseYear)*12+today.getMonth();
    sc.scrollLeft=Math.max(0,tci*CW-100);
    _scrolledToToday=true;
  }
}

var scroll=document.getElementById('chart-scroll');
var ywrap=document.getElementById('yaxis-wrap');
var xtop=document.getElementById('xaxis-top');
var xbot=document.getElementById('xaxis-bot');
scroll.addEventListener('scroll',function(){
  xtop.scrollLeft=scroll.scrollLeft;
  xbot.scrollLeft=scroll.scrollLeft;
  ywrap.scrollTop=scroll.scrollTop;
  if(scroll.scrollLeft+scroll.clientWidth>scroll.scrollWidth-CW*6){VIEW_COLS+=24;redraw();}
});

function getMainPos(e){var r=document.getElementById('cvMain').getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function hitTest(mx,my){
  for(var i=0;i<lots.length;i++){
    var lot=lots[i],feed=parseDate(lot.feedDate);if(!feed||!lot.outAge)continue;
    var age=parseInt(lot.outAge),dispAge=Math.min(age,MAX_AGE);
    var tAge=clampTransfer((lot.transferAge!==undefined)?lot.transferAge:Math.min(120,dispAge),age);
    var pt=toXY(addDays(feed,tAge),tAge,_baseYear);
    if(Math.abs(mx-pt.x)<=9&&Math.abs(my-pt.y)<=9)return{type:'transfer',lot:lot};
  }
  for(var i=0;i<lots.length;i++){
    var lot=lots[i],feed=parseDate(lot.feedDate);if(!feed||!lot.outAge)continue;
    var age=parseInt(lot.outAge),dispAge=Math.min(age,MAX_AGE);
    var p=toXY(addDays(feed,dispAge),dispAge,_baseYear);
    if(Math.sqrt((mx-p.x)*(mx-p.x)+(my-p.y)*(my-p.y))<14)return{type:'arrow',lot:lot};
  }
  return null;
}

var cvMain=document.getElementById('cvMain');
cvMain.addEventListener('mousedown',function(e){
  var pos=getMainPos(e),hit=hitTest(pos.x,pos.y);
  if(hit){dragState={type:hit.type,id:hit.lot.id};document.body.style.cursor='grabbing';e.preventDefault();}
});
cvMain.addEventListener('mousemove',function(e){
  var pos=getMainPos(e);
  cvMain.style.cursor=hitTest(pos.x,pos.y)?'grab':'default';
});
document.addEventListener('mousemove',function(e){
  if(dragState){
    var pos=getMainPos(e),lot=null;
    for(var i=0;i<lots.length;i++){if(lots[i].id===dragState.id){lot=lots[i];break;}}
    if(!lot)return;
    if(dragState.type==='arrow'){
      var d=posToDate(pos.x,_baseYear),a=posToAge(pos.y);
      if(d){lot.outAge=a;redraw();renderLotList();}
    } else {
      var feed=parseDate(lot.feedDate),d=posToDate(pos.x,_baseYear);
      if(feed&&d){
        var days=Math.round((d.getTime()-feed.getTime())/86400000);
        lot.transferAge=clampTransfer(days,parseInt(lot.outAge));
        redraw();renderLotList();
      }
    }
    return;
  }
  var cvRect=cvMain.getBoundingClientRect();
  var mx=e.clientX-cvRect.left,my=e.clientY-cvRect.top;
  var tt=document.getElementById('tooltip');
  if(mx<0||my<0||mx>_COLS*CW||my>ROWS*CH){tt.style.display='none';return;}
  var best=null,bestD=16;
  lots.forEach(function(lot){
    var feed=parseDate(lot.feedDate);if(!feed||!lot.outAge)return;
    var age=parseInt(lot.outAge),dispAge=Math.min(age,MAX_AGE),steps=Math.min(dispAge,400);
    for(var s=0;s<=steps;s++){
      var d=Math.round(s/steps*dispAge),date=addDays(feed,d),p=toXY(date,d,_baseYear);
      var dist=Math.sqrt((mx-p.x)*(mx-p.x)+(my-p.y)*(my-p.y));
      if(dist<bestD){bestD=dist;best={lot:lot,ageDays:d,date:date};}
    }
  });
  if(best){
    var lot=best.lot,ageDays=best.ageDays,date=best.date;
    var age=parseInt(lot.outAge);
    var tAge=clampTransfer((lot.transferAge!==undefined)?lot.transferAge:Math.min(120,Math.min(age,MAX_AGE)),age);
    var td=addDays(parseDate(lot.feedDate),tAge);
    var band=(Math.floor(ageDays/30)*30+1)+'〜'+((Math.floor(ageDays/30)+1)*30)+'日齢';
    var overNote=age>MAX_AGE?' <span style="color:#E24B4A">⚠'+age+'日齢（超過）</span>':'';
    document.getElementById('tt-name').textContent=lot.name||('ロット'+lot.id);
    document.getElementById('tt-body').innerHTML=
      '<div class="tt-r"><span>日齢</span><span><b>'+ageDays+'</b> 日</span></div>'+
      '<div class="tt-r"><span>日齢帯</span><span>'+band+'</span></div>'+
      '<div class="tt-r"><span>日付</span><span>'+date.toLocaleDateString('ja-JP')+'</span></div>'+
      '<div class="tt-r"><span>移動日</span><span class="red">'+td.toLocaleDateString('ja-JP')+'('+tAge+'日)</span></div>'+
      '<div class="tt-r"><span>アウト設定</span><span>'+age+'日齢'+overNote+'</span></div>';
    var sr=scroll.getBoundingClientRect();
    tt.style.display='block';
    tt.style.left=(e.clientX-sr.left+14)+'px';
    tt.style.top=(e.clientY-sr.top-10)+'px';
  } else {tt.style.display='none';}
});
document.addEventListener('mouseup',function(){if(dragState){dragState=null;document.body.style.cursor='';redraw();}});
scroll.addEventListener('mouseleave',function(){document.getElementById('tooltip').style.display='none';});

document.getElementById('f-age').addEventListener('input',function(){
  var v=parseInt(this.value);
  document.getElementById('age-warn').style.display=(v>MAX_AGE)?'block':'none';
});

function initSizes(){
  var outer=document.getElementById('chart-outer');
  var ow=outer.clientWidth,oh=outer.clientHeight;
  var mainW=ow-YW,mainH=oh-XH*2;
  document.getElementById('cvCornerTL').style.cssText='width:'+YW+'px;height:'+XH+'px';
  document.getElementById('cvCornerBL').style.cssText='width:'+YW+'px;height:'+XH+'px';
  xtop.style.cssText='width:'+mainW+'px;height:'+XH+'px;left:'+YW+'px;top:0;overflow:hidden;position:absolute;z-index:10;pointer-events:none';
  xbot.style.cssText='width:'+mainW+'px;height:'+XH+'px;left:'+YW+'px;bottom:0;overflow:hidden;position:absolute;z-index:10;pointer-events:none';
  var mid=document.getElementById('chart-mid');
  mid.style.cssText='position:absolute;top:'+XH+'px;bottom:'+XH+'px;left:0;right:0;display:flex;overflow:hidden';
  ywrap.style.cssText='width:'+YW+'px;height:'+mainH+'px;overflow:hidden;flex-shrink:0;position:relative;z-index:10';
  scroll.style.cssText='flex:1;width:'+mainW+'px;height:'+mainH+'px;overflow:auto;position:relative';
  redraw();
}

function renderLotList(){
  var el=document.getElementById('lot-list');
  if(!lots.length){
    el.innerHTML='<div style="font-size:11px;color:#6b7280;padding:8px 0">まだロットがありません</div>';
    return;
  }
  el.innerHTML=lots.map(function(l){
    var feed=parseDate(l.feedDate),age=parseInt(l.outAge);
    var tAge=clampTransfer((l.transferAge!==undefined)?l.transferAge:Math.min(120,Math.min(age,MAX_AGE)),age);
    var td=feed?addDays(feed,tAge):null;
    var overMark=age>MAX_AGE?'<span style="color:#E24B4A;font-size:10px"> ⚠</span>':'';
    return '<div class="lot-item">'+
      '<span class="lot-dot" style="background:'+l.color+'"></span>'+
      '<span class="lot-name">'+(l.name||'ロット'+l.id)+overMark+'</span>'+
      '<span class="lot-meta" style="color:#E24B4A">'+(td?td.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'}):'')+' ('+tAge+'日)</span>'+
      '<button class="btn-del" onclick="removeLot('+l.id+')">✕</button>'+
      '</div>';
  }).join('');
}

function addLot(){
  var name=document.getElementById('f-name').value.trim();
  var feedDate=document.getElementById('f-date').value;
  var outAge=parseInt(document.getElementById('f-age').value);
  if(!feedDate||!outAge||outAge<1){alert('餌付け日とアウト日齢を入力してください');return;}
  var initTransfer=Math.min(120,Math.min(outAge,MAX_AGE));
  lots.push({id:nid++,name:name,feedDate:feedDate,outAge:outAge,color:COLORS[lots.length%COLORS.length],transferAge:initTransfer});
  document.getElementById('f-name').value='';
  document.getElementById('f-age').value='';
  document.getElementById('age-warn').style.display='none';
  _scrolledToToday=true;
  redraw();renderLotList();
}
function removeLot(id){
  lots=lots.filter(function(l){return l.id!==id;});
  redraw();renderLotList();
}

var today=new Date();
document.getElementById('f-date').value=
  today.getFullYear()+'-'+
  String(today.getMonth()+1).padStart(2,'0')+'-'+
  String(today.getDate()).padStart(2,'0');

renderLotList();
setTimeout(initSizes,100);
window.addEventListener('resize',initSizes);
</script>
